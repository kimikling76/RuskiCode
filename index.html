<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RuskiCode Studio</title><style>
:root{color-scheme:dark;--bg:#101211;--panel:#191c1a;--line:#303730;--muted:#9da69f;--accent:#c8ef92}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f5ef;font:15px system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a,select{cursor:pointer}button{color:inherit;border:1px solid var(--line);background:#242a25;border-radius:10px;padding:11px 17px;transition:background .2s,transform .2s}button:hover{background:#35402f}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:#182012;border:0}.primary:hover{background:#ddffaf}aside{position:fixed;width:224px;inset:0 auto 0 0;border-right:1px solid var(--line);padding:30px 18px;display:flex;flex-direction:column;background:#141715}.brand{font-size:23px;letter-spacing:-1px;font-weight:700;padding:0 12px 30px}.brand span{color:var(--accent)}.subtitle{font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:5px}nav{display:grid;gap:6px}nav button{text-align:left;background:none;border:0;color:var(--muted)}nav button.active{background:#2c3627;color:var(--accent)}.account{margin-top:auto;border-top:1px solid var(--line);padding:20px 10px;color:var(--muted);font-size:12px}main{margin-left:224px;padding:0 42px 40px;max-width:1700px}header{height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:15px}select{background:var(--panel);color:#ddd;border:1px solid var(--line);padding:9px;border-radius:8px}.badge{font-size:11px;letter-spacing:1px;color:var(--accent);border:1px solid #455b32;padding:6px 9px;border-radius:6px}h1{font-size:clamp(32px,4vw,54px);font-weight:500;letter-spacing:-2px;margin:14px 0}h2{font-weight:500;letter-spacing:-.6px}p{color:var(--muted);line-height:1.65}.hero{padding:46px 0 30px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;overflow:hidden}.art{height:150px;border-radius:12px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#425943,#222d28 55%,#1c241f);font:48px Georgia;color:#c8ef92}.art.video{background:radial-gradient(ellipse at right,#51435f,#24212b);color:#d5c3ef}.art.image{background:radial-gradient(ellipse at top left,#69543a,#2d281f);color:#e5cfa4}.card h2{margin:0}.card p{min-height:50px;font-size:13px}.sectionline{display:flex;justify-content:space-between;align-items:center;margin:30px 0 15px}.project{display:flex;align-items:center;gap:24px}.cover{width:92px;height:123px;background:#e8eee0;color:#214e43;padding:13px;font:21px Georgia;border-radius:5px;flex-shrink:0}.project button{margin-left:auto}.workspace{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:30px}.paper{background:#fff;color:#222;min-height:640px;padding:45px;max-width:595px;margin:auto;box-shadow:0 20px 60px #0004}.paper h2{color:#216b5c;font-size:30px}.paper [contenteditable]{outline:none;border:1px dashed transparent;white-space:pre-wrap;line-height:1.9}.paper [contenteditable]:focus{border-color:#216b5c}.paper img{max-width:100%;max-height:250px;object-fit:contain;display:block;margin:20px auto}.tools{display:grid;gap:12px;align-content:start}.tools textarea,textarea,input{width:100%;background:#111512;color:#eee;border:1px solid var(--line);border-radius:10px;padding:14px;resize:vertical}.tools label{color:var(--muted);font-size:13px}.notice{background:#232b20;border:1px solid #3f4b34;border-radius:10px;padding:15px;color:#bcc8b3;font-size:13px;line-height:1.6}.chat{max-width:850px;margin:30px auto}.chat textarea{min-height:140px}.pill{font-size:12px;background:#2b3328;border-radius:20px;padding:7px 12px;color:#becbb3;display:inline-block;margin:4px}.footer{color:var(--muted);font-size:12px;margin-top:36px}#toast{position:fixed;bottom:24px;right:24px;background:#c8ef92;color:#192313;padding:16px;border-radius:10px;display:none;max-width:320px}.hidden{display:none!important}a{color:var(--accent)}@media(max-width:1000px){main{padding:0 24px 30px}.grid{grid-template-columns:1fr}.art{height:110px}.workspace{grid-template-columns:1fr}.project{flex-wrap:wrap}}@media(max-width:650px){aside{position:static;width:auto;padding:16px}.brand{padding-bottom:12px}nav{grid-template-columns:repeat(3,1fr)}nav button{padding:10px;font-size:12px}.account{display:none}main{margin:0;padding:0 18px 30px}header{height:70px}.paper{padding:24px}.project button{margin-left:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{aside,header,.hero,.tools,.footer,#toast{display:none!important}main{margin:0;padding:0}.workspace{display:block}.paper{box-shadow:none;max-width:none;min-height:0;padding:15mm}.paper [contenteditable]{border:0}@page{size:A4;margin:0}}

const dictionary={es:{nav:['Inicio','Libro','Agente editorial','Imágenes','Video','Biblioteca','Configuración'],private:'Espacio para dos · acceso pendiente',prototype:'PROTOTIPO',foot:'RuskiCode Studio · Interfaz de prueba · IA y colaboración pendientes de conexión',hello:'De la idea a la próxima página.',intro:'Tu estudio para escribir, diseñar y dar vida a Русский код. Un espacio pensado para crear con intención.',eyebrow:'TU ESPACIO CREATIVO',book:'Diseñá tu libro',bookdesc:'Páginas editables, estructura clara y materiales para adultos.',image:'Creá una imagen',imagedesc:'Referencias, personajes y una dirección visual consistente.',video:'Contá una historia',videodesc:'De la primera idea al guion y las escenas de tu video.',open:'Abrir estudio',recent:'Tu proyecto',continue:'Continuar',unit:'Unidad 1 · Presentaciones',draft:'Borrador editable · Nivel A1',save:'Guardar en este navegador',export:'Exportar PDF / Imprimir',upload:'Agregar o reemplazar imagen',download:'Descargar proyecto editable',import:'Importar proyecto',editor:'Tu página, tu criterio.',editintro:'Hacé clic en los textos para editarlos. Guardá el proyecto para seguir trabajando.',hint:'Este editor conserva texto e imagen por separado. La exportación PDF abre el diálogo de impresión; elegí Guardar como PDF.',agent:'Conversá con tu agente editorial',agentdesc:'Aquí podrás revisar la progresión A1, reciclar vocabulario y comprobar el diseño para adultos.',prompt:'Describí tu idea, la página o el cambio que querés trabajar…',pending:'La IA todavía no está conectada. Podés preparar y guardar tu brief; no se enviará a ningún modelo.',brief:'Guardar brief',saved:'Guardado en este navegador',media:'Prepará tu dirección creativa',reference:'Idea → referencias → propuesta → generación → revisión',kie:'Proveedor previsto: KIE.ai. La generación requiere conectar la API desde el servidor.',library:'Tus materiales, en un lugar.',empty:'Todavía no hay archivos compartidos. La biblioteca colaborativa requiere al connection.',library:'Your materials, together.',empty:'No shared files yet. The collaborative library needs storage and user access.',settings:'Studio settings',keys:'KIE connection',keydesc:'The key will be configured as a server secret. This prototype does not collect or store API keys.',visit:'Open KIE.ai',team:'Team',teamdesc:'Designed for you and your collaborator. Sign-in and synchronization are not implemented yet.'},ru:{nav:['Главная','Книга','Редактор ИИ','Изображения','Видео','Библиотека','Настройки'],private:'Для двоих · доступ не настроен',prototype:'ПРОТОТИП',foot:'RuskiCode Studio · Прототип · ИИ и совместная работа пока не подключены',hello:'От идеи к новой странице.',intro:'Ваша студия для создания и оформления «Русского кода». Пространство для продуманной работы.',eyebrow:'ВАША ТВОРЧЕСКАЯ СТУДИЯ',book:'Создайте книгу',bookdesc:'Редактируемые страницы и материалы для взрослых.',image:'Создайте изображение',imagedesc:'Образцы, персонажи и единый визуальный стиль.',video:'Расскажите историю',videodesc:'От первой идеи до сценария и сцен видео.',open:'Открыть студию',recent:'Ваш проект',continue:'Продолжить',unit:'Урок 1 · Знакомство',draft:'Редактируемый черновик · Уровень A1',save:'Сохранить в этом браузере',export:'Экспорт PDF / Печать',upload:'Добавить или заменить изображение',download:'Скачать редактируемый проект',import:'Импорт проекта',editor:'Ваша страница, ваше решение.',editintro:'Нажмите на текст для редактирования. Сохраните проект для дальнейшей работы.',hint:'Текст и изображение сохраняются отдельно. Для PDF выберите «Сохранить как PDF» в диалоге печати.',agent:'Обсудите книгу с ИИ-редактором',agentdesc:'Здесь можно будет проверять уровень A1, повторение лексики и оформление для взрослых.',prompt:'Опишите идею, страницу или нужное изменение…',pending:'ИИ пока не подключён. Можно сохранить задание; оно не будет отправлено модели.',brief:'Сохранить задание',saved:'Сохранено в этом браузере',media:'Подготовьте творческое задание',reference: let lang=localStorage.getItem('ruskicode-language')||'es',page=0; if(!dictionary[lang])lang='es';let project;try{project=JSON.parse(localStorage.getItem('ruskicode-project'))}catch{}project=project||{title:'Урок 1. Знакомство',text:'Кто это? Посмотри. Скажи.\n\nЭто Джон. Джон — учитель.\nЭто Миша. Миша — ученик.\nЭто Маша. Маша — ученица.\n\nЭто Миша или Джон?\nЭто ____________________.',image:''};const t=k=>dictionary[lang][k];const view=document.getElementById('view');function toast(){let e=document.getElementById('toast');e.textContent=t('saved');e.style.display='block';setTimeout(()=>e.style.display='none',2500)}function store(){localStorage.setItem('ruskicode-project',JSON.stringify(project));toast()}function collect(){if(page===1){project.title=document.getElementById('ptitle').innerText;project.text=document.getElementById('ptext').innerText}}function go(n){collect();page=n;render()}function hero(title,description){return `<div class="hero"><div class="eyebrow">${t('eyebrow')}</div><h1>${title}</h1><p>${description}</p></div>`}function render(){document.documentElement.lang=lang;document.getElementById('language').value=lang;document.getElementById('nav').innerHTML=t('nav').map((n,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${['◈','▤','✧','▧','▷','▦','⚙'][i]} &nbsp; ${n}</button>`).join('');document.getElementById('breadcrumb').textContent=t('nav')[page];document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));if(page===0){view.innerHTML=hero(t('hello'),t('intro'))+`<div class="grid">${[['book','bookdesc','Аа',1,''],['image','imagedesc','✧',3,'image'],['video','videodesc','▷',4,'video']].map(([a,b,c,n,cl])=>`<article class="card"><div class="art ${cl}">${c}</div><h2>${t(a)}</h2><p>${t(b)}</p><button onclick="go(${n})">${t('open')} ↗</button></article>`).join('')}</div><div class="sectionline"><h2>${t('recent')}</h2><span class="badge">A1</span></div><div class="card project"><div class="cover">Русский<br>код<br><small>A1</small></div><div><h2>Русский код</h2><p>${t('unit')}<br>${t('draft')}</p></div><button class="primary" onclick="go(1)">${t('continue')} →</button></div>`}else if(page===1){view.innerHTML=hero(t('editor'),t('editintro'))+`<div class="workspace"><article class="paper"><span>A1 · Русский код</span><h2 contenteditable="true" id="ptitle" aria-label="Page title"></h2><div contenteditable="true" id="ptext" aria-label="Page text"></div><img id="pimage" alt=""><hr><small>Русский код · A1 · 1</small></article><div class="tools"><div class="notice">${t('hint')}</div><button class="primary" onclick="collect();store()">${t('save')}</button><button onclick="collect();window.print()">${t('export')}</button><label>${t('upload')}<input id="imagefile" type="file" accept="image/png,image/jpeg,image/webp"></label><button onclick="downloadProject()">${t('download')}</button><label>${t('import')}<input id="projectfile" type="file" accept="application/json"></label></div></div>`;document.getElementById('ptitle').textContent=project.title;document.getElementById('ptext').textContent=project.text;if(project.image){document.getElementById('pimage').src=project.image;document.getElementById('pimage').alt='Project illustration'}else document.getElementById('pimage').hidden=true;document.getElementById('imagefile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>4000000){alert('Maximum image size: 4 MB');return}const r=new FileReader();r.onload=()=>{collect();project.image=r.result;render()};r.readAsDataURL(f)};document.getElementById('projectfile').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(typeof v.title!=='string'||typeof v.text!=='string'||(v.image&&!/^data:image\/(png|jpeg|webp);base64,/.test(v.image)))throw Error();project={title:v.title,text:v.text,image:v.image||''};render()}catch{alert('Invalid project file')}}}else if([2,3,4].includes(page)){view.innerHTML=hero(page===2?t('agent'):t('media'),page===2?t('agentdesc'):t('reference'))+`<div class="chat"><div class="notice">${t('pending')}</div><p>${page===2?'Русский код · A1 · 1:1':t('kie')}</p>${page===3?'<span class="pill">Nano Banana 2.1 · KIE</span>':page===4?'<span class="pill">Seedance 2.5 · KIE</span>':''}<textarea id="brief" aria-label="Creative brief" placeholder="${t('prompt')}"></textarea><p><button class="primary" onclick="localStorage.setItem('ruskicode-brief-'+page,document.getElementById('brief').value);toast()">${t('brief')}</button></p></div>`;document.getElementById('brief').value=localStorage.getItem('ruskicode-brief-'+page)||''}else if(page===5){view.innerHTML=hero(t('library'),t('empty'))+`<div class="card"><h2>Русский код · A1</h2><p>${t('draft')}</p><button onclick="go(1)">${t('continue')}</button></div>`}else{view.innerHTML=hero(t('settings'),'RuskiCode · ES / RU / EN')+`<div class="grid"><div class="card"><h2>${t('keys')}</h2><p>${t('keydesc')}</p><a href="https://kie.ai/" target="_blank" rel="noopener noreferrer">${t('visit')} ↗</a></div><div class="card"><h2>${t('team')}</h2><p>${t('teamdesc')}</p></div></div>`}}
function downloadProject(){collect();let a=document.createElement('a');let url=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}));a.href=url;a.download='ruskicode-page.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('language').onchange=e=>{collect();lang=e.target.value;localStorage.setItem('ruskicode-language',lang);render()};render();
</script></body></html>
